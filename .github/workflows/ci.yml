# Template from AI-Master-Instructions, adapted with the efficient-github-actions skill.
# Tier 1 only: type check, unit and golden tests, test-traps and the master drift check (`npm run check`,
# about 1.2 s locally on 2026-11-12). Browser tests (e2e/) run locally with a PR screenshot, never in CI (D-013).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Draft runs (job skipped) get their own group, so a draft push can't cancel the run that
  # "ready for review" starts in the same second (seen on PR #2, runs 17 and 18).
  group: ci-${{ github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft PRs don't run CI; marking one ready does (CI-06).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: '[ "$(npm -v)" = "10.9.9" ] || npm install -g npm@10.9.9' # WEB-01: packageManager npm@10.9.9
      - run: npm ci
      - run: npm run check
