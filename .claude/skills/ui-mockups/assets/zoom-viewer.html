<!-- Screenshot viewer (ui-mockups): screenshots fit the screen; tap one to open it full screen and pinch, double-tap,
     drag or use the buttons to zoom. Added to a page by scripts/add-zoom.mjs. No libraries, nothing sent anywhere.
     From dfma-review scripts/zoom_viewer.html (D-024, Morgan's repo). -->
<style>
img.zv-thumb { max-width: 100%; height: auto; cursor: zoom-in; display: block; }
img.zv-thumb:focus-visible { outline: 3px solid #1f5fa8; outline-offset: 2px; }
.zv-hint { font-size: 0.875rem; color: inherit; opacity: 0.75; margin: 2px 0 0; }
.zv { position: fixed; inset: 0; z-index: 1000; background: #0d141c; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.zv[hidden] { display: none !important; }
.zv-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #16263d; color: #ffffff; flex-wrap: wrap; }
.zv-cap { flex: 1 1 100%; min-width: 0; font: 400 0.875rem/1.35 system-ui, sans-serif; color: #dfe7f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.zv-bar button { min-width: 44px; min-height: 44px; padding: 0 12px; border: 1px solid #5a7090; border-radius: 4px;
  background: #22364f; color: #ffffff; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
.zv-bar button:focus-visible { outline: 3px solid #8ec1ff; outline-offset: 2px; }
.zv-stage { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; }
.zv-stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }
.zv-level { font: 600 0.875rem ui-monospace, monospace; color: #dfe7f0; min-width: 5em; margin-right: auto; }
</style>
<div class="zv" id="zv" hidden role="dialog" aria-modal="true" aria-label="Screenshot, zoomable">
  <div class="zv-bar">
    <span class="zv-cap" id="zv-cap"></span>
    <span class="zv-level" id="zv-level" aria-live="polite"></span>
    <button type="button" data-z="out" aria-label="Zoom out">−</button>
    <button type="button" data-z="fit">Fit</button>
    <button type="button" data-z="in" aria-label="Zoom in">+</button>
    <button type="button" data-z="close">Close</button>
  </div>
  <div class="zv-stage" id="zv-stage"><img id="zv-img" alt=""></div>
</div>
<script>
(() => {
  const box = document.getElementById("zv"), stage = document.getElementById("zv-stage"), img = document.getElementById("zv-img");
  const cap = document.getElementById("zv-cap"), level = document.getElementById("zv-level");
  let s = 1, x = 0, y = 0, fit = 1, opener = null;
  const pts = new Map();
  let pinch = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${x}px, ${y}px) scale(${s})`; level.textContent = `${(s / fit).toFixed(1)}× fit`; };
  const clampPan = () => {
    const w = img.naturalWidth * s, h = img.naturalHeight * s, W = stage.clientWidth, H = stage.clientHeight;
    x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x));
    y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
  };
  const zoomAt = (ns, cx, cy) => {
    ns = Math.min(Math.max(ns, fit * 0.5), Math.max(fit * 8, 2));
    x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; clampPan(); apply();
  };
  const toFit = () => {
    fit = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
    s = fit; clampPan(); apply();
  };
  const open = (thumb) => {
    opener = thumb; img.src = thumb.currentSrc || thumb.src; img.alt = thumb.alt;
    const fig = thumb.closest("figure"); cap.textContent = fig?.querySelector("figcaption")?.textContent ?? thumb.alt;
    box.hidden = false; document.body.style.overflow = "hidden";
    const go = () => toFit();
    img.complete ? requestAnimationFrame(go) : img.addEventListener("load", go, { once: true });
    box.querySelector('[data-z="close"]').focus();
  };
  const close = () => { box.hidden = true; document.body.style.overflow = ""; pts.clear(); pinch = null; opener?.focus(); };
  for (const t of document.querySelectorAll("main img, figure img, img.zv-thumb")) {
    if (t.id === "zv-img") continue;
    t.classList.add("zv-thumb"); t.tabIndex = 0; t.setAttribute("role", "button");
    t.setAttribute("aria-label", `Open to zoom: ${t.alt}`);
    t.addEventListener("click", () => open(t));
    t.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(t); } });
    const hint = document.createElement("p"); hint.className = "zv-hint"; hint.textContent = "Tap the picture to zoom in.";
    t.after(hint);
  }
  box.addEventListener("click", (e) => {
    const z = e.target.closest("button")?.dataset.z; if (!z) return;
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    if (z === "in") zoomAt(s * 1.5, cx, cy); else if (z === "out") zoomAt(s / 1.5, cx, cy); else if (z === "fit") toFit(); else close();
  });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "Tab") { const b = [...box.querySelectorAll("button")]; const i = b.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); b[b.length - 1].focus(); } else if (!e.shiftKey && i === b.length - 1) { e.preventDefault(); b[0].focus(); } }
  });
  const local = (e) => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  stage.addEventListener("pointerdown", (e) => {
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s }; }
    const now = Date.now();
    if (pts.size === 1 && now - lastTap < 300) { const [cx, cy] = local(e); zoomAt(s > fit * 1.5 ? fit : fit * 3, cx, cy); lastTap = 0; }
    else lastTap = now;
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), cur = local(e); pts.set(e.pointerId, cur);
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(pinch.s * d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    } else if (pts.size === 1) { x += cur[0] - prev[0]; y += cur[1] - prev[1]; clampPan(); apply(); }
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); const [cx, cy] = local(e); zoomAt(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), cx, cy); }, { passive: false });
  addEventListener("resize", () => { if (!box.hidden) toFit(); });
})();
</script>
